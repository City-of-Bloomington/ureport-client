Alias "{{ ureport_client_base_uri }}" "{{ ureport_client_install_path }}/public"
<Directory "{{ ureport_client_install_path }}/public">
    Options FollowSymLinks
    AllowOverride None
    Require all granted

    FallbackResource {{ ureport_client_base_uri }}/index.php

    SetEnv PHP_VALUE post_max_size={{ ureport_client_max_image_size }}
    SetEnv PHP_VALUE upload_max_filesize={{ ureport_client_max_image_size }}

    SetEnv SITE_HOME {{ ureport_client_site_home }}
</Directory>
